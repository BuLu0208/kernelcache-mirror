name: Download Kernelcaches

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Download kernelcaches
        run: python3 scripts/download_kernelcaches.py

      - name: Pack and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd output
          zip -r ../kernelcaches.zip .
          cd ..
          DATE=$(date +%Y%m%d)
          gh release delete "kernelcache-$DATE" --yes 2>/dev/null || true
          gh release create "kernelcache-$DATE" kernelcaches.zip \
            --title "Kernelcaches $DATE" \
            --notes "Auto-generated kernelcache files"
